services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: triply
      POSTGRES_PASSWORD: triply
      POSTGRES_DB: triply
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triply"]
      interval: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://triply:triply@db:5432/triply
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
